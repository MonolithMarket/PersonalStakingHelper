[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false
dynamic_test_linking = false
# Emit native governance artifacts for the separate 0.8.24 integration project.
build_info = true
fs_permissions = [{ access = "read", path = "./integration/monolith/out" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/monolith-gov/lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/monolith-gov/lib/openzeppelin-contracts-upgradeable/contracts/"
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true
